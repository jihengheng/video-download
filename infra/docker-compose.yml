version: "3.9"

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    volumes:
      - ../storage:/app/storage

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python -m app.workers.runner
    env_file:
      - ../.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../storage:/app/storage

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: video_research
      POSTGRES_USER: video_research
      POSTGRES_PASSWORD: change-this-local-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
